<!-- Action buttons + export controls. Every status-changing endpoint re-renders
     this so the buttons match the new status; leaving them in their pre-action
     state invited a second click that either 409'd or (for abandon) really did
     re-run. oob=True when it rides along with another swap. -->
<div id="program-actions"{% if oob %} hx-swap-oob="true"{% endif %}
     class="flex items-center gap-2 flex-wrap print:hidden">
  {% if program.status == 'draft' %}
  <button hx-post="/program/{{ program.id }}/activate"
          hx-target="#program-actions"
          hx-swap="outerHTML"
          class="bg-green-600 text-white text-sm px-4 py-2 rounded-lg hover:bg-green-700">
    Activate
  </button>
  {% endif %}

  {% if program.status == 'active' %}
  <button hx-post="/program/{{ program.id }}/complete"
          hx-target="#outcome-area"
          hx-swap="innerHTML"
          hx-confirm="Mark this program as complete and compute outcomes?"
          class="bg-blue-600 text-white text-sm px-4 py-2 rounded-lg hover:bg-blue-700">
    Complete program
  </button>
  {% endif %}

  {% if program.status in ('draft', 'active') %}
  <button hx-post="/program/{{ program.id }}/abandon"
          hx-target="#program-actions"
          hx-swap="outerHTML"
          hx-confirm="Abandon this program? This cannot be undone."
          class="bg-paper border border-line-dark text-ink-sec text-sm px-4 py-2 rounded-lg hover:bg-paper-150">
    Abandon
  </button>
  {% endif %}

  <a href="/export/program/{{ program.id }}.csv"
     title="Download program as CSV"
     class="inline-flex items-center gap-1.5 border border-line-dark text-ink-sec text-sm px-3 py-2 rounded-lg hover:bg-paper-150 transition-colors">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
    </svg>
    Export CSV
  </a>
  <button onclick="exportPDF()"
          title="Save as PDF"
          class="inline-flex items-center gap-1.5 border border-line-dark text-ink-sec text-sm px-3 py-2 rounded-lg hover:bg-paper-150 transition-colors">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <path stroke-linecap="round" stroke-linejoin="round" d="M17 17H17.01M17 3H5a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V7l-4-4zm0 0v4h4M9 9h1M9 13h6M9 17h3"/>
    </svg>
    Export PDF
  </button>
</div>
